services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cloud_dms_test
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Set MYSQL_TEST_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - security-integration

  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_TEST_PASSWORD"
    environment:
      REDIS_TEST_PASSWORD: ${REDIS_TEST_PASSWORD:?Set REDIS_TEST_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - security-integration

networks:
  security-integration:
    internal: true
