# Mẫu triển khai riêng; không dùng docker-compose.yml cũ cho production.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ${CLOUD_DMS_ENV_FILE:?Đặt đường dẫn file cấu hình bí mật ngoài repository}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__InitializeOnStartup: "false"
      SearchIndex__TokenizerEndpoint: http://embedding:8001/
      Embedding__Endpoint: http://embedding:8001/
      Qdrant__Endpoint: http://qdrant:6333/
      Preview__Endpoint: http://preview:8002/
      Preview__Enabled: ${PREVIEW_ENABLED:-false}
      DataProtection__KeyRingPath: /keys
      DataProtection__CertificatePath: /run/secrets/data-protection.pfx
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - keys:/keys
      - ${DATA_PROTECTION_CERTIFICATE_FILE:?Đặt file chứng chỉ PFX ngoài repository}:/run/secrets/data-protection.pfx:ro
    networks: [backend, egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=256m,noexec,nosuid,nodev"]
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: clouddms
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Cấp từ secret store}
    volumes: ["mysql:/var/lib/mysql"]
    networks: [backend]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Cấp từ secret store}
    volumes: ["./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro", "redis:/data"]
    networks: [backend]
    restart: unless-stopped
  minio:
    build: ./minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Cấp từ secret store}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Cấp từ secret store}
    volumes: ["objects:/data"]
    networks: [backend]
    restart: unless-stopped
  clamav:
    image: ${CLAMAV_IMAGE:?Cấp image ClamAV đã pin digest và kiểm tra coverage}
    volumes: ["./clamav/clamd.conf:/etc/clamav/clamd.conf:ro", "signatures:/var/lib/clamav"]
    networks: [backend]
    mem_limit: 2g
    restart: unless-stopped
  embedding:
    build: ../services/embedding
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Cấp từ secret store, trùng Qdrant__ApiKey của API}
    volumes: ["vectors:/qdrant/storage"]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
  preview:
    profiles: [preview]
    build: ../services/preview
    environment:
      CONVERTER_VERSION: libreoffice-sandbox-v1
    networks: [backend]
    read_only: true
    user: "10001:10001"
    tmpfs:
      - "/tmp:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700"
      - "/jobs:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
networks:
  backend:
    internal: true
  egress: {}
volumes:
  keys: {}
  mysql: {}
  redis: {}
  objects: {}
  signatures: {}
  vectors: {}
