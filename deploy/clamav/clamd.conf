Foreground yes
LogTime no
LogVerbose no
LogClean no
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 500
