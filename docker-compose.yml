services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clouddms-api
    networks: [default, search-internal]
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=clouddms;User=root;Password=${DB_PASSWORD:-RootPass@123};
      - SecurityRedis__ConnectionString=redis:6379,abortConnect=false
      - JwtSettings__SecretKey=${JWT_SECRET:-SuperSecretJwtKeyWith32CharactersMin!}
      - JwtSettings__Issuer=CloudDMS
      - JwtSettings__Audience=CloudDMSUsers
      - JwtSettings__ExpirationMinutes=15
      - ClamAV__Host=clamav
      - ClamAV__Port=3310
      - ClamAV__Enabled=true
      - SearchIndex__TokenizerEndpoint=http://embedding:8001/
      - Embedding__Endpoint=http://embedding:8001/
      - Qdrant__Endpoint=http://qdrant:6333/
      - Preview__Endpoint=http://preview:8002/
      - Preview__Enabled=${PREVIEW_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: clouddms-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-RootPass@123}
      - MYSQL_DATABASE=clouddms
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-RootPass@123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: clouddms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: clouddms-clamav
    ports:
      - "3310:3310"
    restart: unless-stopped

  embedding:
    build:
      context: ./services/embedding
    networks: [search-internal]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped

  preview:
    build:
      context: ./services/preview
    networks: [search-internal]
    read_only: true
    user: "10001:10001"
    tmpfs:
      - "/tmp:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700"
      - "/jobs:size=256m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    networks: [search-internal]
    volumes: ["qdrant-data:/qdrant/storage"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped

networks:
  search-internal:
    internal: true

volumes:
  qdrant-data:
  mysql-data:
